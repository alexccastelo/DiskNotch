# Compila todos os alvos e roda os testes da lógica (alertas, histórico e previsão).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versão do Swift
        run: swift --version
      - name: Compilar
        run: swift build
      - name: Testar alertas
        run: swift run disknotch-probe --testar-alertas
      - name: Testar histórico e previsão
        run: swift run disknotch-probe --testar-historico
      - name: Testar análise do disco
        run: swift run disknotch-probe --testar-analise
      - name: Testar regras de limpeza
        run: swift run disknotch-probe --testar-limpeza
